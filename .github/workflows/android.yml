# The Android app (docs/android.md): arm64, built with the NDK on GitHub's Linux runner. A push to the android branch or a manual run
# (Actions > Android > Run workflow) builds it; the APK is a workflow artifact and a published prerelease ("P.T. Android Port build <n>", tag
# android-build-<n>, under Releases), which the installed app finds by itself when it starts (Updater.java). The last step always
# pushes a short log of the run to the ci-logs branch.
name: Android

on:
  push:
    branches: [android]
    # a change that is only words (the README, the docs, the issue form) builds nothing: each build is a release, and only the
    # newest three are kept
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-none}"
          cmake --version | head -1

      - name: Native build
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          bash tools/android/build.sh native 2>&1 | tee build-native.log

      - name: APK
        env:
          # the build number: the APK's versionCode and the release tag android-build-N, which the app's update check compares
          PT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash tools/android/build.sh apk 2>&1 | tee build-apk.log

      - uses: actions/upload-artifact@v4
        with:
          name: P.T.PC.Port-Android-arm64
          path: dist/P.T.PC.Port-Android-arm64.apk

      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app checks these releases when it starts (Updater.java), so they are published, not drafts: a prerelease named
          # android-build-N, N being the APK's versionCode. A prerelease is never "Latest" and the macOS workflow and the
          # desktop updater ignore it.
          # Drafts left by earlier versions of this step are removed.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft) | select(.tag_name | startswith("android-build")) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          # the title and notes are only for people; the app's update check reads the tag and the asset's name
          SUBJECT="$(git log -1 --format=%s)"
          {
            echo "P.T. Android Port, build $GITHUB_RUN_NUMBER: an arm64 APK built from commit $GITHUB_SHA."
            echo
            echo "Latest change: $SUBJECT"
            echo
            echo "Needs Android 10 or newer with Vulkan 1.3 and your own copy of P.T. (a dump or a fake PKG of CUSA01127); no game files are included."
            echo "See the README for installing and docs/android.md for the details. An installed copy of the app finds this build by itself when it starts."
          } > release-notes.md
          gh release create "android-build-$GITHUB_RUN_NUMBER" dist/P.T.PC.Port-Android-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "P.T. Android Port build $GITHUB_RUN_NUMBER (${GITHUB_SHA::7})" \
            --notes-file release-notes.md \
            --repo "$GITHUB_REPOSITORY" || echo "release step failed (the APK is still a workflow artifact)"
          # keep the newest three Android releases (and their tags)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("android-build-"))] | sort_by(.created_at) | reverse | .[3:] | .[] | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done

      - name: Push a short log to ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "job status: ${{ job.status }}"
            ls -l dist 2>/dev/null || echo "no dist folder"
          } > /tmp/ci/status.txt
          for name in native apk; do
            touch "build-$name.log"
            tail -n 300 "build-$name.log" > "/tmp/ci/$name-tail.log"
            grep -nE "error:|CMake Error|FAILED|fatal error|undefined (reference|symbol)|Execution failed|What went wrong|ninja: build stopped" "build-$name.log" | head -120 > "/tmp/ci/$name-errors.txt" || true
          done
          git config user.name "android-ci"
          git config user.email "android-ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          git clean -ffdxq
          cp /tmp/ci/* .
          git add -A
          git commit --quiet -m "Android CI log for $GITHUB_SHA"
          git push --force origin ci-logs
