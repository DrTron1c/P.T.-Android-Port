# The Android app (docs/android.md): arm64, built with the NDK on GitHub's Linux runner.
#  - a push to the android branch (or a manual run: Actions > Android > Run workflow) builds it and keeps the APK as a workflow artifact;
#  - when android/version.txt names a version that has no release yet (v1.00 for 1.00), the same run publishes the APK as the release of that
#    version, with the notes in android/release-notes/<version>.md, which the installed app finds by itself when it starts (Updater.java);
#    a push of the tag v<version> by hand does the same. A version that already has its release is only built.
# The last step always pushes a short log of the run to the ci-logs branch.
name: Android

on:
  push:
    branches: [android]
    tags: ["v*"]
    # a change that is only words (the README, the docs, the issue form) builds nothing (GitHub does not look at the paths of a tag)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-none}"
          cmake --version | head -1

      - name: Native build
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          bash tools/android/build.sh native 2>&1 | tee build-native.log

      - name: APK
        env:
          # the build number: the APK's versionCode and the release tag android-build-N, which the app's update check compares
          PT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash tools/android/build.sh apk 2>&1 | tee build-apk.log

      - uses: actions/upload-artifact@v4
        with:
          name: P.T.PC.Port-Android-arm64
          path: dist/P.T.PC.Port-Android-arm64.apk

      - name: Publish the release
        # a tag v<version>, or the android branch (and a manual run on it) when android/version.txt has a version without a release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < android/version.txt)"
          TAG="v$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "the tag $GITHUB_REF_NAME does not match android/version.txt ($VERSION): no release made" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released: nothing to publish"
          else
            NOTES="android/release-notes/$VERSION.md"
            if [ ! -f "$NOTES" ]; then
              printf 'P.T. Android Port %s.\n' "$VERSION" > release-notes.md
              NOTES=release-notes.md
            fi
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then WHERE="--verify-tag"; else WHERE="--target $GITHUB_SHA"; fi
            # a full release (not a pre-release, and the latest one): the installed app finds it by its tag, and compares the version
            gh release create "$TAG" dist/P.T.PC.Port-Android-arm64.apk $WHERE --latest \
              --title "P.T. Android Port $VERSION" --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi
          # the builds of the testing time (pre-releases android-build-N) and their tags are removed
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("android-build-")) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done
          # tags of the testing time that have no release any more
          git ls-remote --tags origin 'refs/tags/android-build-*' | awk '{print $2}' |
          while read -r ref; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" || true
          done

      - name: Push a short log to ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "job status: ${{ job.status }}"
            ls -l dist 2>/dev/null || echo "no dist folder"
          } > /tmp/ci/status.txt
          for name in native apk; do
            touch "build-$name.log"
            tail -n 300 "build-$name.log" > "/tmp/ci/$name-tail.log"
            grep -nE "error:|CMake Error|FAILED|fatal error|undefined (reference|symbol)|Execution failed|What went wrong|ninja: build stopped" "build-$name.log" | head -120 > "/tmp/ci/$name-errors.txt" || true
          done
          git config user.name "android-ci"
          git config user.email "android-ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          git clean -ffdxq
          cp /tmp/ci/* .
          git add -A
          git commit --quiet -m "Android CI log for $GITHUB_SHA"
          git push --force origin ci-logs
