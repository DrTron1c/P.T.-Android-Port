plugins {
    id 'com.android.application'
}

// The CI passes its run number as the versionCode (-PptVersionCode=N) and tags the release android-build-N, which is how the
// app's update check (Updater.java) tells a newer build from the one installed. A local build is 1: older than any CI build.
def ptVersionCode = (project.findProperty('ptVersionCode') ?: '1').toString().toInteger()
// the GitHub repository whose releases the app checks: the one the CI runs in, else this fork
def ptUpdateRepo = (project.findProperty('ptUpdateRepo') ?: System.getenv('GITHUB_REPOSITORY') ?: 'DrTron1c/pt-pc').toString()

android {
    namespace 'com.ptport.android'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.ptport.android'
        minSdk 29
        targetSdk 34
        versionCode ptVersionCode
        versionName "1.0.3-android.${ptVersionCode}"
        buildConfigField 'String', 'UPDATE_REPO', "\"${ptUpdateRepo}\""
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one and keeps the imported game files
    // (a key made fresh on each CI run would force an uninstall, which deletes them). It is a throwaway key for
    // sideloading, not a store key.
    signingConfigs {
        ptport {
            storeFile file('../pt-port.keystore')
            storePassword 'ptportandroid'
            keyAlias 'ptport'
            keyPassword 'ptportandroid'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // debuggable only so that "adb shell run-as com.ptport.android cat files/pt-runtime/data/pt.log" can read the game's
            // log; the native code is built with the same optimization either way
            debuggable true
            signingConfig signingConfigs.ptport
        }
        debug {
            signingConfig signingConfigs.ptport
        }
    }

    packaging {
        jniLibs {
            // libwhisper.so and ggml are dlopen'ed by name later; keep libraries extracted on disk
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
